<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>A Museum of Us</title>
<style>
:root{--bg:#0d0b0c;--fg:#f3ece4;--mut:#b9ada0;--acc:#d9b68a;--gl:rgba(20,17,18,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b0c}}
:root[data-theme="dark"]{--bg:#0d0b0c}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;touch-action:none}
input{color-scheme:dark}
#js{position:fixed;z-index:3;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);width:110px;height:110px;border-radius:50%;background:var(--gl);border:1px solid rgba(217,182,138,.5);touch-action:none}
#jk{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(217,182,138,.55);pointer-events:none}
button,input{font:inherit;color:var(--fg)}
button{background:var(--gl);border:1px solid rgba(217,182,138,.5);border-radius:99px;padding:.55em 1.1em;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{background:rgba(217,182,138,.25)}
input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:.5em .8em}
[hidden]{display:none!important}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,rgba(13,11,12,.45),rgba(13,11,12,.88));transition:opacity .9s}
#intro h1{font-weight:400;font-size:clamp(2.4rem,8vw,5rem);letter-spacing:.06em;margin:0}
.sub{color:var(--mut);font-style:italic;font-size:1.1rem;margin:.6em 0 1.6em}
.names,.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.pri{background:var(--acc);color:#1a1410;border-color:var(--acc)}.pri:hover{background:#e8c9a0}
#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#fx span{position:absolute;bottom:-8%;opacity:0;animation:fl linear infinite}
@keyframes fl{10%{opacity:.5}90%{opacity:.25}100%{transform:translateY(-115vh) translateX(30px);opacity:0}}
#hud>*{position:fixed;z-index:3}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;gap:14px;background:var(--gl);padding:.4em 1em;border-radius:99px}
#code{color:var(--acc)}
#mus{top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;display:flex;gap:8px;align-items:center;background:var(--gl);padding:.3em .8em;border-radius:99px}
#mus small{color:var(--mut);font-size:.7rem}
#act{bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:0;right:0;text-align:center;color:var(--mut);font-size:.78rem}
.ov{position:fixed;inset:0;z-index:6;background:rgba(5,4,6,.82);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{position:relative;background:#171315;border:1px solid rgba(217,182,138,.4);border-radius:14px;padding:22px;max-width:min(94vw,640px);text-align:center}
#lbimg{max-width:100%;max-height:58vh;border-radius:4px;border:10px solid #f6f1e8}
#lbph{color:var(--mut);padding:50px 20px}
.card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:12px}
#ask .card{width:min(92vw,560px);background:radial-gradient(circle at 50% 0,#1f2a4a,#0e1226)}
#ask h2{font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);margin:.3em 0 .8em}
#yes{background:var(--acc);color:#1a1410;border-color:var(--acc);transition:all .5s;font-size:1.1rem}
.g1{box-shadow:0 0 22px #f0b6bd}
.g2{box-shadow:0 0 30px #f0b6bd;animation:pu 1.2s infinite}
.g3{box-shadow:0 0 40px #fff2c0;animation:pu .7s infinite,sh 2s linear infinite;background:linear-gradient(90deg,#d9b68a,#fff2c0,#f0b6bd,#d9b68a)!important;background-size:300%}
@keyframes pu{50%{filter:brightness(1.3)}}@keyframes sh{to{background-position:300%}}
#x{position:absolute;top:8px;right:10px;padding:.1em .6em}
#msg{color:var(--mut);min-height:1.4em;font-style:italic}
.b{position:absolute;pointer-events:none;animation:up 1.6s forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
#rain{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#rain span{position:absolute;top:-8%;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(40deg)}}
textarea{font:inherit;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:.5em .8em;color-scheme:dark}
label{display:block;margin:8px 0;color:var(--mut);font-size:.85rem}
#near{top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;transform:translateX(-50%);z-index:4;background:var(--acc);color:#1a1410;border-color:var(--acc)}
#mm{top:calc(env(safe-area-inset-top,0px) + 56px);left:14px;width:180px;height:30px;background:var(--gl);border-radius:10px;cursor:pointer}
#cap2{bottom:calc(env(safe-area-inset-bottom,0px) + 36px);left:50%;transform:translateX(-50%);max-width:90vw;text-align:center;background:var(--gl);padding:.6em 1.2em;border-radius:14px;font-size:1.15rem;font-style:italic;z-index:4}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:8}
body.touring #act>*:not(#tourb){display:none!important}
body.gift #add,body.gift #lm,body.gift #sb,body.gift #rep,body.gift #rm,body.gift #uv,body.gift #cin{display:none!important}
body.gift #cap,body.gift #dt{pointer-events:none}
@media (prefers-reduced-motion:reduce){#fx,#rain,.b{display:none}.g2,.g3{animation:none}*{transition-duration:.01s!important}}
</style></head><body>
<div id="intro"><div id="fx"></div>
<h1>A Museum of Us</h1><p class="sub">Every picture tells a story. Every room holds a memory.</p>
<div class="names"><input id="n1" placeholder="Your name" maxlength="20"><input id="n2" placeholder="Their name" maxlength="20"></div>
<div class="btns"><button id="b1" class="pri">Start Exploring</button><button id="b2">Create Private Room</button><button id="b3">Join Room</button></div>
<div id="join" class="btns" hidden><input id="jc" placeholder="Room code" maxlength="5"><button id="go">Join</button></div><small id="note" style="color:var(--mut);margin-top:10px"></small></div>
<div id="hud" hidden>
<div id="top"><span id="room"></span><span id="code"></span></div>
<div id="mus"><button id="mute">♪</button><input id="vol" type="range" min="0" max="1" step=".05" value=".5"><small>generated placeholder music</small></div>
<div id="act"><button data-a="stand">Stand together</button><button data-a="sit">Sit</button><button data-a="hands">Hold hands</button><button data-a="kiss">Kiss</button><button data-a="kneel">Kneel with ring</button><button data-a="wave">Wave</button><button data-a="talk">Talk</button><button id="lm">Load character (.glb)</button><button id="add">Add photos</button><span id="cin" hidden><button id="uv">Upload video</button> <button id="pp">Play / Pause</button></span><button id="tourb">▶ Tour</button><button id="sb">⚙ Settings</button><button id="asq" hidden>Ask the question</button></div>
<canvas id="mm" width="240" height="40" aria-label="Room map: tap a room to travel"></canvas><div id="cap2" hidden></div><button id="near" hidden></button>
<div id="js" hidden><div id="jk"></div></div>
<div id="hint">WASD move · Shift run · drag to look · click a frame to view it · E interact</div></div>
<div id="lb" class="ov" hidden><div class="card"><img id="lbimg" alt=""><div id="lbph">An empty frame, waiting for a memory.</div>
<div class="row"><input id="cap" placeholder="Caption"><input id="dt" placeholder="Date" type="date"></div>
<div class="row"><button id="rep">Upload / Replace</button><button id="rm">Remove</button><button id="lbx">Close</button></div></div></div>
<div id="ask" class="ov" hidden><div class="card"><button id="x">×</button><h2 id="q">Will you marry me?</h2>
<div class="row" id="ar"><button id="yes">YES ❤️</button><button id="no">NO</button></div><p id="msg"></p><button id="tell" class="pri" hidden></button></div></div>
<div id="rain"></div><div id="fade"></div>
<input id="fi" type="file" accept="image/*" hidden><input id="fv" type="file" accept="video/*" hidden><input id="fm" type="file" accept=".glb,.gltf" multiple hidden>
<div id="set" class="ov" hidden><div class="card" style="width:min(94vw,520px);text-align:left">
<label>The question<input id="sq" maxlength="40" style="width:100%;box-sizing:border-box"></label>
<label>Message shown after YES<input id="sy" maxlength="140" style="width:100%;box-sizing:border-box"></label>
<label>Letter shown before the museum opens (gift file)<textarea id="sl" rows="5" maxlength="1200" style="width:100%;box-sizing:border-box"></textarea></label>
<div class="row"><button id="sm">Upload music</button><button id="smx">Use generated music</button></div>
<div class="row"><button id="gift" class="pri">Make gift file</button><button id="sv">Save backup</button><button id="ld">Open backup</button><button id="sx">Close</button></div></div></div>
<input id="fs" type="file" accept="audio/*" hidden><input id="fj" type="file" accept=".json" hidden>
<script id="data" type="application/json">null</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script>
const SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s),T=THREE,PI=Math.PI;
const net={emit(e,d){/* swap in socket.emit(e,d) when the Socket.IO server is connected */}};
const scene=new T.Scene();scene.background=new T.Color(0x0b0a0c);scene.fog=new T.Fog(0x0b0a0c,25,95);
const cam=new T.PerspectiveCamera(60,1,.1,200);
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.5:2));R.shadowMap.enabled=true;R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;
document.body.prepend(R.domElement);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const M=(c,r=.8,m=0,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o));
function ct(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}
const la=(a,b,k)=>{const d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*k};

/* ---------- architecture ---------- */
const marble=ct(256,256,(g,w,h)=>{g.fillStyle='#d8ccb9';g.fillRect(0,0,w,h);g.strokeStyle='rgba(120,100,80,.3)';g.lineWidth=2;g.strokeRect(0,0,w,h);g.strokeStyle='rgba(140,120,100,.13)';for(let i=0;i<14;i++){g.beginPath();g.moveTo(Math.random()*w,0);g.bezierCurveTo(Math.random()*w,h/3,Math.random()*w,h*2/3,Math.random()*w,h);g.stroke()}});
marble.wrapS=marble.wrapT=T.RepeatWrapping;marble.repeat.set(30,8);
const floor=new T.Mesh(new T.PlaneGeometry(60,16),M(0xffffff,.3,.05,{map:marble}));floor.rotation.x=-PI/2;floor.position.set(18,0,0);floor.receiveShadow=true;scene.add(floor);
const walls=[],W=M(0xf2eee8,.9),B=M(0x0c0c0e,.5);
function wall(x0,z0,x1,z1,mat=W,h=4.2,solid=true){const m=new T.Mesh(new T.BoxGeometry(x1-x0,h,z1-z0),mat);m.position.set((x0+x1)/2,h/2,(z0+z1)/2);m.castShadow=!mat.transparent;m.receiveShadow=true;scene.add(m);if(solid)walls.push({x0,z0,x1,z1})}
wall(-12.15,-8.15,30,-7.85);wall(-12.15,7.85,30,8.15);wall(-12.15,-8.15,-11.85,8.15);wall(47.85,-8.15,48.15,8.15);
wall(11.85,-8.15,12.15,-1.6);wall(11.85,1.6,12.15,8.15);wall(29.85,-8.15,30.15,-1.6);wall(29.85,1.6,30.15,8.15);
wall(-.15,-3,.15,3,B);
const glass=M(0x9fb4d0,.05,.1,{transparent:true,opacity:.12});
wall(30,-8.1,48,-7.9,glass);wall(30,7.9,48,8.1,glass);
for(let x=30;x<=48;x+=3){wall(x-.06,-8.1,x+.06,-7.9,B,4.2,false);wall(x-.06,7.9,x+.06,8.1,B,4.2,false)}
const ceil=new T.Mesh(new T.PlaneGeometry(42,16),M(0x16130f,.9));ceil.rotation.x=PI/2;ceil.position.set(9,4.2,0);scene.add(ceil);
wall(15.5,-7.95,26.5,-7.8,B,4.2,false);

/* lights */
scene.add(new T.HemisphereLight(0xfff0dd,0x2a2420,.55));
const L=(c,i,d,x,y,z)=>{const l=new T.PointLight(c,i,d);l.position.set(x,y,z);scene.add(l);const f=new T.Mesh(new T.CylinderGeometry(.12,.12,.05,12),new T.MeshBasicMaterial({color:0xffe2b0}));f.position.set(x,4.15,z);scene.add(f)};
[[-8,-4],[-8,4],[6,-4],[6,4]].forEach(p=>L(0xffd9a8,.7,13,p[0],3.9,p[1]));
[[18,0],[24,0]].forEach(p=>L(0xffb878,.25,10,p[0],3.9,p[1]));
const spot=new T.SpotLight(0xffe2b8,1.1,30,1.0,.6);spot.position.set(-6,4,0);spot.target.position.set(-6,0,0);spot.castShadow=true;scene.add(spot,spot.target);
const moon=new T.DirectionalLight(0x9fb2ff,.55);moon.position.set(55,16,-55);moon.target.position.set(41,0,0);moon.castShadow=true;Object.assign(moon.shadow.camera,{left:-14,right:14,top:14,bottom:-14,far:140});moon.shadow.camera.updateProjectionMatrix();scene.add(moon,moon.target);
L(0xffcf94,.5,14,36,3.8,0);L(0xffcf94,.4,14,44,3.8,0);

/* ---------- frames & plaque ---------- */
const frames=[],mem=[],benches=[],texs=[],fpos=[],plaq=[];const GLOW=ct(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,6,64,64,64);r.addColorStop(0,'rgba(255,226,176,.38)');r.addColorStop(1,'rgba(255,226,176,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
function mkFrame(i,x,z,ry){const g=new T.Group();g.position.set(x,1.9,z);g.rotation.y=ry;
const fr=new T.Mesh(new T.BoxGeometry(2.2,1.7,.08),M(0x111111,.4));fr.castShadow=true;
const mt=new T.Mesh(new T.PlaneGeometry(2,1.5),M(0xf6f1e8,.9));mt.position.z=.045;
texs[i]=ct(340,240,(c,w,h)=>{const gr=c.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#cfc2b0');gr.addColorStop(1,'#a89887');c.fillStyle=gr;c.fillRect(0,0,w,h);c.fillStyle='rgba(60,45,35,.75)';c.textAlign='center';c.font='italic 30px Georgia';c.fillText('Memory '+(i+1),w/2,h/2);c.font='16px Georgia';c.fillText('click to add a photo',w/2,h/2+30)});
const ph=new T.Mesh(new T.PlaneGeometry(1,1),M(0xffffff,.6,0,{map:texs[i]}));ph.scale.set(1.7,1.2,1);ph.position.z=.05;ph.userData.i=i;
const gl=new T.Mesh(new T.PlaneGeometry(4.2,3.2),new T.MeshBasicMaterial({map:GLOW,transparent:true,blending:T.AdditiveBlending,depthWrite:false,fog:false}));gl.position.z=-.01;const pl=new T.Mesh(new T.PlaneGeometry(1.7,.26),new T.MeshBasicMaterial({transparent:true}));pl.position.set(0,-1.02,.05);pl.visible=false;g.add(gl,fr,mt,ph,pl);scene.add(g);frames[i]=ph;plaq[i]=pl;fpos[i]={x,z,nx:Math.sin(ry),nz:Math.cos(ry)}}
let k=0;[-8,-3,3,8].forEach(x=>mkFrame(k++,x,-7.8,0));[-8,-3,3,8].forEach(x=>mkFrame(k++,x,7.8,PI));
[[-1.5,.17,PI/2],[1.5,.17,PI/2],[-1.5,-.17,-PI/2],[1.5,-.17,-PI/2]].forEach(a=>mkFrame(k++,a[1],a[0],a[2]));
const plq=new T.Mesh(new T.PlaneGeometry(2.6,1.2),new T.MeshBasicMaterial());plq.position.set(-11.8,1.9,0);plq.rotation.y=PI/2;scene.add(plq);
function plaque(a,b){plq.material.map=ct(520,240,(c,w,h)=>{c.fillStyle='#0c0c0e';c.fillRect(0,0,w,h);c.strokeStyle='#d9b68a';c.strokeRect(10,10,w-20,h-20);c.fillStyle='#f3ece4';c.textAlign='center';c.font='34px Georgia';c.fillText('A MUSEUM OF US',w/2,80);c.fillStyle='#d9b68a';c.font='italic 26px Georgia';c.fillText(a&&b?'for '+a+' & '+b:'for the two of us',w/2,125);c.fillStyle='#b9ada0';c.font='italic 18px Georgia';c.fillText('A place where memories become a world.',w/2,175)});plq.material.needsUpdate=true}plaque();
function bench(x,z,ry){const g=new T.Group();const s=new T.Mesh(new T.BoxGeometry(1.9,.1,.5),M(0x2a2420,.6)),b=new T.Mesh(new T.BoxGeometry(1.7,.4,.35),B);s.position.y=.45;b.position.y=.22;s.castShadow=s.receiveShadow=true;g.add(s,b);g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);benches.push({x,z,ry});const a=Math.abs(Math.sin(ry))>.5,hx=a?.3:1,hz=a?1:.3;walls.push({x0:x-hx,x1:x+hx,z0:z-hz,z1:z+hz})}
bench(-4,0,PI/2);bench(4,0,-PI/2);[18,21,24].forEach(x=>bench(x,3,PI));bench(37,4.5,PI);

/* ---------- cinema ---------- */
const screen=new T.Mesh(new T.PlaneGeometry(7,3.94),new T.MeshBasicMaterial({map:ct(640,360,(c,w,h)=>{c.fillStyle='#08080c';c.fillRect(0,0,w,h);c.fillStyle='#b9ada0';c.textAlign='center';c.font='italic 30px Georgia';c.fillText('Memory Cinema',w/2,h/2-6);c.font='18px Georgia';c.fillText('upload a video to begin',w/2,h/2+28)})}));
screen.position.set(21,2.1,-7.78);scene.add(screen);
const sl=new T.PointLight(0x9db8ff,.3,12);sl.position.set(21,3,-5);scene.add(sl);
const vid=document.createElement('video');vid.playsInline=true;vid.loop=true;let vtex=null;

/* ---------- proposal room ---------- */
const sky=new T.Mesh(new T.SphereGeometry(90,32,16),new T.MeshBasicMaterial({side:T.BackSide,fog:false,map:ct(1024,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#050a1c');gr.addColorStop(.55,'#101a3a');gr.addColorStop(1,'#1b1f33');g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<500;i++){g.fillStyle='rgba(255,255,240,'+Math.random()*.9+')';g.fillRect(Math.random()*w,Math.random()*h*.6,1.5,1.5)}})}));sky.position.set(39,0,0);scene.add(sky);
const mn=new T.Mesh(new T.SphereGeometry(4,24,16),new T.MeshBasicMaterial({color:0xfff6dc,fog:false}));mn.position.set(55,16,-55);scene.add(mn);
const halo=new T.Mesh(new T.SphereGeometry(7,24,16),new T.MeshBasicMaterial({color:0xaab8ff,transparent:true,opacity:.1,fog:false}));halo.position.copy(mn.position);scene.add(halo);
const ped=new T.Mesh(new T.CylinderGeometry(.45,.5,1.1,24),M(0xf4f1ea,.3));ped.position.set(41,.55,0);ped.castShadow=true;scene.add(ped);walls.push({x0:40.5,x1:41.5,z0:-.5,z1:.5});
const ring=new T.Group();ring.position.set(41,1.3,0);
const band=new T.Mesh(new T.TorusGeometry(.12,.025,12,32),M(0xd4af37,.25,.7,{emissive:0x3a2a05}));band.rotation.x=.4;
const gem=new T.Mesh(new T.OctahedronGeometry(.06),M(0xffffff,.05,.2,{emissive:0xbfd8ff}));gem.position.set(0,.14,-.04);ring.add(band,gem);scene.add(ring);
const sign=new T.Mesh(new T.PlaneGeometry(5,1.1),new T.MeshBasicMaterial({transparent:true,map:ct(640,140,(c,w,h)=>{c.fillStyle='#fff4e0';c.shadowColor='#ffd9a0';c.shadowBlur=18;c.font='italic 56px Georgia';c.textAlign='center';c.fillText('Will you marry me?',w/2,88)})}));sign.position.set(46.5,2.8,0);sign.rotation.y=-PI/2;scene.add(sign);
